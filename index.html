<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
<title>学 · Китайский для жизни</title>
<script src="https://cdn.jsdelivr.net/npm/telegram-web-app@1.0.1/telegram-web-app.js"></script>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

:root {
  --bg: #F6F4EF;
  --surface: #FFFFFF;
  --surface2: #F1EFEA;
  --border: #E3DDD2;
  --text: #2C2A27;
  --muted: #9B968B;
  --accent: #C5543B;
  --accent-bg: #FEF0EB;
  --accent-text: #B33F28;
  --green: #2E7D5E;
  --green-bg: #E6F4EF;
  --red: #CE5A42;
  --red-bg: #FEF2EF;
  --gold: #E6B422;
  --gold-bg: #FFF6E5;
  --radius-card: 28px;
  --radius-btn: 44px;
  --shadow-sm: 0 2px 8px rgba(0,0,0,0.02), 0 1px 2px rgba(0,0,0,0.03);
  --shadow-md: 0 6px 14px rgba(0,0,0,0.05);
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #151311;
    --surface: #22211E;
    --surface2: #2D2B27;
    --border: #3D3A34;
    --text: #F0EDE6;
    --muted: #A39D8F;
    --accent: #E27B60;
    --accent-bg: #3E2922;
    --accent-text: #F0C4B2;
    --green: #8DBA86;
    --green-bg: #20312A;
    --red: #E6896E;
    --red-bg: #3F2C25;
    --gold: #E6B422;
    --gold-bg: #2F2A1A;
  }
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, -apple-system, 'Segoe UI', 'SF Pro Text', sans-serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  max-width: 500px;
  margin: 0 auto;
  position: relative;
}

/* декоративный намёк на иероглифы */
body::after {
  content: "⿅ 礼 茶";
  position: fixed;
  bottom: 12px;
  right: 12px;
  font-size: 56px;
  opacity: 0.03;
  pointer-events: none;
  font-family: monospace;
  z-index: 0;
}

/* хедер */
.header {
  padding: 20px 20px 10px;
  display: flex;
  align-items: center;
  gap: 12px;
  border-bottom: 0.5px solid var(--border);
  background: var(--bg);
  backdrop-filter: blur(8px);
  position: sticky;
  top: 0;
  z-index: 6;
}
.logo {
  width: 48px;
  height: 48px;
  background: linear-gradient(145deg, var(--accent-bg), #F5E2D8);
  border-radius: 24px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 26px;
  font-weight: 600;
  box-shadow: var(--shadow-sm);
}
.header h1 {
  font-size: 20px;
  font-weight: 640;
  letter-spacing: -0.3px;
  background: linear-gradient(130deg, var(--accent), #E6A27A);
  background-clip: text;
  -webkit-background-clip: text;
  color: transparent;
}
.header p {
  font-size: 11px;
  color: var(--muted);
  margin-top: 2px;
  font-weight: 470;
}

/* табы */
.tabs {
  display: flex;
  background: var(--surface);
  gap: 6px;
  padding: 8px 16px;
  border-bottom: 0.5px solid var(--border);
}
.tab {
  flex: 1;
  text-align: center;
  padding: 10px 6px;
  font-size: 14px;
  font-weight: 540;
  color: var(--muted);
  border-radius: 60px;
  cursor: pointer;
  transition: all 0.2s ease;
  background: transparent;
}
.tab.active {
  background: var(--accent-bg);
  color: var(--accent-text);
  font-weight: 590;
}

/* экраны */
.screen {
  display: none;
  flex: 1;
  flex-direction: column;
  padding: 20px 16px 32px;
  gap: 20px;
  overflow-y: auto;
  z-index: 2;
}
.screen.active {
  display: flex;
}

/* карточки */
.card {
  background: var(--surface);
  border-radius: var(--radius-card);
  border: 0.5px solid var(--border);
  overflow: hidden;
  box-shadow: var(--shadow-sm);
}
.card-header {
  padding: 16px 20px 8px 20px;
  font-size: 16px;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 10px;
  border-bottom: 0.5px solid var(--border);
  color: var(--text);
}
.card-header span {
  background: var(--accent-bg);
  padding: 4px 12px;
  border-radius: 50px;
  font-size: 13px;
  color: var(--accent-text);
}
.list-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 14px 20px;
  border-bottom: 0.5px solid var(--border);
}
.list-item:last-child {
  border-bottom: none;
}
.word-ru {
  font-size: 15px;
  font-weight: 510;
  letter-spacing: -0.2px;
}
.word-zh {
  background: var(--surface2);
  padding: 5px 14px;
  border-radius: 60px;
  font-size: 13px;
  font-weight: 480;
  color: var(--accent-text);
}
.price-num {
  font-family: monospace;
  font-size: 17px;
  font-weight: 620;
  letter-spacing: -0.3px;
}
.price-pron {
  background: var(--surface2);
  padding: 5px 14px;
  border-radius: 60px;
  font-size: 13px;
}

/* статистика - компактная сетка, не растягивается */
.stats-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
  margin-bottom: 6px;
}
.stat-card {
  background: var(--surface);
  border-radius: 20px;
  padding: 10px 4px;
  text-align: center;
  border: 0.5px solid var(--border);
  box-shadow: var(--shadow-sm);
}
.stat-number {
  font-size: 24px;
  font-weight: 700;
  line-height: 1.3;
}
.stat-label {
  font-size: 10px;
  color: var(--muted);
  letter-spacing: 0.2px;
}
.streak-card .stat-number {
  color: var(--gold);
}
.best-streak-hint {
  font-size: 9px;
  margin-top: 4px;
  color: var(--muted);
}

/* режимы переключения */
.mode-switch {
  display: flex;
  gap: 10px;
  padding: 8px 12px 12px 12px;
}
.mode-btn {
  flex: 1;
  background: var(--surface2);
  border: 0.5px solid var(--border);
  border-radius: 48px;
  padding: 12px 0;
  text-align: center;
  font-weight: 530;
  font-size: 14px;
  cursor: pointer;
  color: var(--muted);
  transition: 0.2s;
}
.mode-btn.active-mode {
  background: var(--accent);
  color: white;
  border-color: var(--accent);
}

/* активная викторина */
.quiz-question-card {
  background: var(--surface);
  border-radius: 36px;
  padding: 28px 16px;
  text-align: center;
  border: 0.5px solid var(--border);
  box-shadow: var(--shadow-md);
}
.quiz-label {
  font-size: 12px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--accent);
  margin-bottom: 12px;
}
.quiz-word {
  font-size: 32px;
  font-weight: 700;
  background: linear-gradient(135deg, var(--text), var(--accent));
  background-clip: text;
  -webkit-background-clip: text;
  color: transparent;
  word-break: break-word;
}
.options-grid {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin: 8px 0 4px;
}
.opt-btn {
  width: 100%;
  padding: 14px 18px;
  background: var(--surface2);
  border: 0.5px solid var(--border);
  border-radius: 60px;
  font-size: 15px;
  font-weight: 500;
  text-align: left;
  display: flex;
  align-items: center;
  gap: 10px;
  transition: 0.1s linear;
  cursor: pointer;
  color: var(--text);
}
.opt-btn:active {
  transform: scale(0.98);
}
.opt-btn.correct {
  background: var(--green-bg);
  border-color: var(--green);
  color: var(--green);
}
.opt-btn.wrong {
  background: var(--red-bg);
  border-color: var(--red);
  color: var(--red);
}
.opt-btn:disabled {
  opacity: 0.7;
  cursor: default;
  transform: none;
}
.start-btn {
  width: 100%;
  padding: 16px;
  background: var(--accent);
  border: none;
  border-radius: 60px;
  font-size: 17px;
  font-weight: 600;
  color: white;
  cursor: pointer;
  transition: 0.2s;
  box-shadow: var(--shadow-sm);
}
.next-btn {
  width: 100%;
  padding: 15px;
  background: var(--surface2);
  border: 0.8px solid var(--border);
  border-radius: 60px;
  font-size: 16px;
  font-weight: 590;
  color: var(--text);
  cursor: pointer;
  transition: 0.2s;
  margin-top: 6px;
}
.next-btn:active {
  transform: scale(0.97);
}
.next-btn.disabled-btn, .next-btn:disabled {
  opacity: 0.5;
  transform: none;
  cursor: not-allowed;
}
.empty-state {
  text-align: center;
  padding: 32px 16px;
  color: var(--muted);
  font-size: 14px;
}
</style>
</head>
<body>
<div class="header">
  <div class="logo">学</div>
  <div><h1>Учим китайский</h1><p>произношение • тоны • цены</p></div>
</div>

<div class="tabs">
  <div class="tab active" onclick="switchTab('words-tab')">📖 Слова</div>
  <div class="tab" onclick="switchTab('prices-tab')">🏷️ Ценники</div>
  <div class="tab" onclick="switchTab('quiz-tab')">🔥 Тест</div>
</div>

<div id="words-tab" class="screen active">
  <div class="card">
    <div class="card-header"><span>🍜 кухня</span> Лексика</div>
    <div id="words-list-container"></div>
  </div>
  <div style="font-size: 11px; color: var(--muted); text-align: center;">слова для рынка и ресторана</div>
</div>

<div id="prices-tab" class="screen">
  <div class="card">
    <div class="card-header"><span>💰 числа</span> Китайские цены</div>
    <div id="prices-list-container"></div>
  </div>
  <div style="font-size: 11px; color: var(--muted); text-align: center;">произношение как у хуан (лаобань)</div>
</div>

<div id="quiz-tab" class="screen">
  <!-- компактная статистика + серия -->
  <div class="stats-grid">
    <div class="stat-card"><div class="stat-number" id="s-total">0</div><div class="stat-label">всего</div></div>
    <div class="stat-card"><div class="stat-number green" id="s-correct">0</div><div class="stat-label">верно</div></div>
    <div class="stat-card"><div class="stat-number red" id="s-wrong">0</div><div class="stat-label">ошибки</div></div>
    <div class="stat-card streak-card"><div class="stat-number" id="streak-count">0</div><div class="stat-label">🔥 серия</div><div class="best-streak-hint" id="best-streak-hint"></div></div>
  </div>

  <div class="card" style="overflow: visible;">
    <div class="mode-switch">
      <div id="mode-words-btn" class="mode-btn active-mode" onclick="setQuizMode('words')">📖 Слова</div>
      <div id="mode-prices-btn" class="mode-btn" onclick="setQuizMode('prices')">🔢 Цены</div>
    </div>
  </div>

  <div id="quiz-idle">
    <button class="start-btn" onclick="startQuiz()">▶ Начать тренировку</button>
  </div>

  <div id="quiz-active" style="display:none; flex-direction: column; gap: 18px;">
    <div class="quiz-question-card">
      <div class="quiz-label" id="q-label">Как переводится?</div>
      <div class="quiz-word" id="q-word">—</div>
    </div>
    <div class="options-grid" id="q-options"></div>
    <!-- Кнопка следующего вопроса всегда видна, но disabled до ответа -->
    <button class="next-btn" id="next-btn" disabled onclick="nextQuestion()">➡ Следующий вопрос</button>
  </div>
</div>

<script>
// ------------------------------------------------------------
//  ЗАКРЕПЛЁННЫЕ ДАННЫЕ (НЕЛЬЗЯ ДОБАВИТЬ/УДАЛИТЬ)
// ------------------------------------------------------------
const FIXED_WORDS = {
  "чайник": "хуу",
  "хуан (хозяин)": "лаобань",
  "ложка": "сшаодзы",
  "вилка": "чхаа",
  "пароварка": "Вэй Я Гуо",
  "сковородка (мал.)": "Щьюэ Пин Гуо",
  "сковородка (бол.)": "Тай Гуо",
  "сито": "Джэн Лонг",
  "3 ножа (в комплекте)": "Сан Ба Дао (И Тао)",
  "черпак": "Сао дзы",
  "лопатка": "Гуо Тшан",
  "доска разделочная": "Бан",
  "термос": "Бэй дз (Ка Фэй Бэй)",
  "бритва": "Ти Щю Дао",
  "маленькие щипчики": "Сяо Джы Дья Дао",
  "щипчики большие": "Да Джы Дья Дао"
};

// Ценники согласно ТЗ (уникальные ключи, сортировка по числу)
const rawPriceEntries = [
  ["2680", "льян тьен льёу бай ба"],
  ["1280", "и тьен ар бай ба"],
  ["2980", "льян тьен дьёу бай ба"],
  ["980", "дьёу бай ба"],
  ["198", "и бай дьёу шы ба"],
  ["398", "сан бай дьёу шы ба"],
  ["298", "льян бай дьёу шы ба"],
  ["80", "ба шы"],
  ["100", "и бай"]
];
const FIXED_PRICES = {};
for (const [num, pron] of rawPriceEntries) {
  if (!FIXED_PRICES.hasOwnProperty(num)) {
    FIXED_PRICES[num] = pron;
  }
}

// ------------------------------------------------------------
//  СТАТИСТИКА
// ------------------------------------------------------------
let stats = {
  total: 0,
  correct: 0,
  wrong: 0,
  streak: 0,
  bestStreak: 0
};

function loadStats() {
  try {
    const saved = localStorage.getItem('zh_quiz_stats_v3');
    if (saved) {
      const p = JSON.parse(saved);
      stats.total = p.total || 0;
      stats.correct = p.correct || 0;
      stats.wrong = p.wrong || 0;
      stats.streak = p.streak || 0;
      stats.bestStreak = p.bestStreak || 0;
    }
  } catch(e) {}
}
function saveStats() {
  try {
    localStorage.setItem('zh_quiz_stats_v3', JSON.stringify({
      total: stats.total, correct: stats.correct, wrong: stats.wrong,
      streak: stats.streak, bestStreak: stats.bestStreak
    }));
  } catch(e) {}
}

function renderStatsUI() {
  document.getElementById('s-total').innerText = stats.total;
  document.getElementById('s-correct').innerText = stats.correct;
  document.getElementById('s-wrong').innerText = stats.wrong;
  document.getElementById('streak-count').innerText = stats.streak;
  const bestEl = document.getElementById('best-streak-hint');
  if (bestEl) bestEl.innerText = `🏆 рекорд: ${stats.bestStreak}`;
}

function updateStatsAfterAnswer(isCorrect) {
  stats.total++;
  if (isCorrect) {
    stats.correct++;
    stats.streak++;
    if (stats.streak > stats.bestStreak) {
      stats.bestStreak = stats.streak;
    }
  } else {
    stats.wrong++;
    stats.streak = 0;
  }
  saveStats();
  renderStatsUI();
}

// ------------------------------------------------------------
//  ОТРИСОВКА СПИСКОВ (только просмотр)
// ------------------------------------------------------------
function renderFixedWords() {
  const container = document.getElementById('words-list-container');
  if (!container) return;
  const entries = Object.entries(FIXED_WORDS);
  if (!entries.length) { container.innerHTML = '<div class="empty-state">📭 словарь пуст</div>'; return; }
  container.innerHTML = entries.map(([ru, zh]) => `
    <div class="list-item">
      <div class="word-ru">${ru}</div>
      <div class="word-zh">${zh}</div>
    </div>
  `).join('');
}

function renderFixedPrices() {
  const container = document.getElementById('prices-list-container');
  if (!container) return;
  const entries = Object.entries(FIXED_PRICES).sort((a,b) => parseInt(a[0]) - parseInt(b[0]));
  if (!entries.length) { container.innerHTML = '<div class="empty-state">🏷️ нет ценников</div>'; return; }
  container.innerHTML = entries.map(([num, pron]) => `
    <div class="list-item">
      <div class="price-num">${num} ¥</div>
      <div class="price-pron">${pron}</div>
    </div>
  `).join('');
}

// ------------------------------------------------------------
//  ЛОГИКА КВИЗА
// ------------------------------------------------------------
let quizMode = 'words';
let quizActive = false;
let currentQuestionObj = null;    // { key, correctAnswer, options }
let answerLock = false;           // заблокировано после ответа до next
let nextButton = null;

function getVocab() {
  return quizMode === 'words' ? FIXED_WORDS : FIXED_PRICES;
}

function generateQuestion() {
  const vocab = getVocab();
  const keys = Object.keys(vocab);
  if (keys.length < 2) return null;
  const correctKey = keys[Math.floor(Math.random() * keys.length)];
  const correctAnswer = vocab[correctKey];
  const allValues = Object.values(vocab);
  const otherValues = allValues.filter(v => v !== correctAnswer);
  if (otherValues.length === 0) return null;
  const shuffled = [...otherValues].sort(() => Math.random() - 0.5);
  const wrongOptions = shuffled.slice(0, 3);
  let options = [correctAnswer, ...wrongOptions];
  for (let i = options.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [options[i], options[j]] = [options[j], options[i]];
  }
  return { key: correctKey, correctAnswer, options };
}

function renderQuestionUI() {
  if (!currentQuestionObj) return;
  const q = currentQuestionObj;
  const label = document.getElementById('q-label');
  const wordSpan = document.getElementById('q-word');
  if (quizMode === 'words') {
    label.innerText = '📖 Как перевести?';
    wordSpan.innerText = q.key;
  } else {
    label.innerText = '🔢 Произношение цены';
    wordSpan.innerText = `${q.key} ¥`;
  }
  const optionsContainer = document.getElementById('q-options');
  optionsContainer.innerHTML = '';
  q.options.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerText = opt;
    btn.onclick = () => handleAnswer(btn, opt);
    optionsContainer.appendChild(btn);
  });
  // сброс блокировки и кнопки "следующий"
  answerLock = false;
  if (nextButton) {
    nextButton.disabled = true;
    nextButton.classList.add('disabled-btn');
  }
}

function handleAnswer(btn, selected) {
  if (answerLock) return;
  if (!currentQuestionObj) return;
  const isCorrect = (selected === currentQuestionObj.correctAnswer);
  answerLock = true;
  
  // подсветка всех вариантов
  const allBtns = document.querySelectorAll('#q-options .opt-btn');
  allBtns.forEach(b => {
    b.disabled = true;
    if (b.innerText === currentQuestionObj.correctAnswer) {
      b.classList.add('correct');
    }
    if (b === btn && !isCorrect) {
      b.classList.add('wrong');
    } else if (b === btn && isCorrect) {
      b.classList.add('correct');
    }
  });
  
  updateStatsAfterAnswer(isCorrect);
  
  // активируем кнопку "следующий вопрос"
  if (nextButton) {
    nextButton.disabled = false;
    nextButton.classList.remove('disabled-btn');
  }
}

function nextQuestion() {
  if (!quizActive) return;
  if (!nextButton || nextButton.disabled) return; // неактивна — ждём ответа
  const newQ = generateQuestion();
  if (!newQ) {
    // если вдруг ошибка (недостаточно вариантов)
    alert("Не хватает слов для теста (нужно хотя бы 2)");
    endQuiz();
    return;
  }
  currentQuestionObj = newQ;
  renderQuestionUI();
}

function startQuiz() {
  const vocab = getVocab();
  if (Object.keys(vocab).length < 2) {
    alert("Добавьте минимум 2 слова/цены в словарь (уже есть, но на всякий случай)");
    return;
  }
  const firstQ = generateQuestion();
  if (!firstQ) {
    alert("Ошибка генерации вопроса");
    return;
  }
  quizActive = true;
  currentQuestionObj = firstQ;
  document.getElementById('quiz-idle').style.display = 'none';
  document.getElementById('quiz-active').style.display = 'flex';
  renderQuestionUI();
}

function endQuiz() {
  quizActive = false;
  document.getElementById('quiz-active').style.display = 'none';
  document.getElementById('quiz-idle').style.display = 'block';
  currentQuestionObj = null;
  if (nextButton) {
    nextButton.disabled = true;
    nextButton.classList.add('disabled-btn');
  }
}

function setQuizMode(mode) {
  quizMode = mode;
  const wordsBtn = document.getElementById('mode-words-btn');
  const pricesBtn = document.getElementById('mode-prices-btn');
  if (mode === 'words') {
    wordsBtn.classList.add('active-mode');
    pricesBtn.classList.remove('active-mode');
  } else {
    pricesBtn.classList.add('active-mode');
    wordsBtn.classList.remove('active-mode');
  }
  if (quizActive) {
    endQuiz();
  }
  renderStatsUI(); // просто обновить отображение
}

// ------------------------------------------------------------
//  ПЕРЕКЛЮЧЕНИЕ ВКЛАДОК
// ------------------------------------------------------------
function switchTab(tabId) {
  const screens = ['words-tab', 'prices-tab', 'quiz-tab'];
  screens.forEach(id => {
    const el = document.getElementById(id);
    if (id === tabId) el.classList.add('active');
    else el.classList.remove('active');
  });
  const tabsBtns = document.querySelectorAll('.tab');
  tabsBtns.forEach((btn, idx) => {
    if (screens[idx] === tabId) btn.classList.add('active');
    else btn.classList.remove('active');
  });
  if (tabId === 'words-tab') renderFixedWords();
  if (tabId === 'prices-tab') renderFixedPrices();
  if (tabId === 'quiz-tab') {
    renderStatsUI();
    if (quizActive) endQuiz();
    document.getElementById('quiz-idle').style.display = 'block';
    document.getElementById('quiz-active').style.display = 'none';
  }
}

// ------------------------------------------------------------
//  ИНИЦИАЛИЗАЦИЯ
// ------------------------------------------------------------
document.addEventListener('DOMContentLoaded', () => {
  loadStats();
  renderFixedWords();
  renderFixedPrices();
  renderStatsUI();
  nextButton = document.getElementById('next-btn');
  if (nextButton) {
    nextButton.disabled = true;
    nextButton.classList.add('disabled-btn');
  }
  setQuizMode('words');
  // закрываем активный тест на всякий случай
  quizActive = false;
  document.getElementById('quiz-active').style.display = 'none';
  document.getElementById('quiz-idle').style.display = 'block';
});

// глобальные функции для onclick
window.switchTab = switchTab;
window.startQuiz = startQuiz;
window.nextQuestion = nextQuestion;
window.setQuizMode = setQuizMode;
window.handleAnswer = handleAnswer; // резерв
</script>
</body>
</html>
