<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
<title>学 · Китайский: тест и карточки</title>
<script src="https://cdn.jsdelivr.net/npm/telegram-web-app@1.0.1/telegram-web-app.js"></script>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

/* темы (светлая по умолчанию) */
:root {
  --bg: #F6F4EF;
  --surface: #FFFFFF;
  --surface2: #F1EFEA;
  --border: #E3DDD2;
  --text: #2C2A27;
  --muted: #9B968B;
  --accent: #C5543B;
  --accent-bg: #FEF0EB;
  --accent-text: #B33F28;
  --green: #2E7D5E;
  --green-bg: #E6F4EF;
  --red: #CE5A42;
  --red-bg: #FEF2EF;
  --gold: #E6B422;
  --gold-bg: #FFF6E5;
  --radius-card: 28px;
  --radius-btn: 44px;
  --shadow-sm: 0 2px 8px rgba(0,0,0,0.02), 0 1px 2px rgba(0,0,0,0.03);
  --shadow-md: 0 6px 14px rgba(0,0,0,0.05);
  --transition: 0.2s ease;
}

body.dark {
  --bg: #151311;
  --surface: #22211E;
  --surface2: #2D2B27;
  --border: #3D3A34;
  --text: #F0EDE6;
  --muted: #A39D8F;
  --accent: #E27B60;
  --accent-bg: #3E2922;
  --accent-text: #F0C4B2;
  --green: #8DBA86;
  --green-bg: #20312A;
  --red: #E6896E;
  --red-bg: #3F2C25;
  --gold: #E6B422;
  --gold-bg: #2F2A1A;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  max-width: 500px;
  margin: 0 auto;
  position: relative;
  transition: background 0.2s, color 0.1s;
}

/* хедер с кнопкой темы */
.header {
  padding: 18px 20px 10px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 0.5px solid var(--border);
  background: var(--bg);
  backdrop-filter: blur(8px);
  position: sticky;
  top: 0;
  z-index: 10;
}
.header-left {
  display: flex;
  align-items: center;
  gap: 12px;
}
.logo {
  width: 46px;
  height: 46px;
  background: linear-gradient(145deg, var(--accent-bg), #F5E2D8);
  border-radius: 24px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 24px;
}
.header-info h1 {
  font-size: 18px;
  font-weight: 640;
  background: linear-gradient(130deg, var(--accent), #E6A27A);
  background-clip: text;
  -webkit-background-clip: text;
  color: transparent;
}
.header-info p {
  font-size: 11px;
  color: var(--muted);
}
.theme-toggle {
  background: var(--surface2);
  border: 0.5px solid var(--border);
  border-radius: 40px;
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  cursor: pointer;
  transition: 0.1s;
}

/* табы */
.tabs {
  display: flex;
  background: var(--surface);
  gap: 6px;
  padding: 8px 16px;
  border-bottom: 0.5px solid var(--border);
}
.tab {
  flex: 1;
  text-align: center;
  padding: 10px 6px;
  font-size: 14px;
  font-weight: 540;
  color: var(--muted);
  border-radius: 60px;
  cursor: pointer;
  transition: var(--transition);
}
.tab.active {
  background: var(--accent-bg);
  color: var(--accent-text);
  font-weight: 590;
}

.screen {
  display: none;
  flex: 1;
  flex-direction: column;
  padding: 20px 16px 32px;
  gap: 20px;
  overflow-y: auto;
}
.screen.active {
  display: flex;
}

/* карточки для списков */
.card {
  background: var(--surface);
  border-radius: var(--radius-card);
  border: 0.5px solid var(--border);
  overflow: hidden;
}
.card-header {
  padding: 16px 20px 8px;
  font-size: 16px;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 10px;
  border-bottom: 0.5px solid var(--border);
}
.list-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 14px 20px;
  border-bottom: 0.5px solid var(--border);
}
.word-ru, .price-num {
  font-weight: 510;
}
.word-zh, .price-pron {
  background: var(--surface2);
  padding: 5px 14px;
  border-radius: 60px;
  font-size: 13px;
}

/* статистика (компактная) */
.stats-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
}
.stat-card {
  background: var(--surface);
  border-radius: 20px;
  padding: 10px;
  text-align: center;
  border: 0.5px solid var(--border);
}
.stat-number {
  font-size: 24px;
  font-weight: 700;
}
.streak-animate {
  animation: streakPop 0.4s cubic-bezier(0.34, 1.2, 0.64, 1);
}
@keyframes streakPop {
  0% { transform: scale(1); background: var(--gold-bg); }
  50% { transform: scale(1.2); background: var(--gold); color: #2C2A27; }
  100% { transform: scale(1); background: var(--surface); }
}

/* режим карточек */
.flip-container {
  perspective: 1000px;
  margin: 10px 0 20px;
}
.flipper {
  position: relative;
  width: 100%;
  height: 280px;
  transition: transform 0.5s;
  transform-style: preserve-3d;
  cursor: pointer;
}
.flipper.flipped {
  transform: rotateY(180deg);
}
.front, .back {
  position: absolute;
  width: 100%;
  height: 100%;
  backface-visibility: hidden;
  border-radius: 36px;
  background: var(--surface);
  border: 0.5px solid var(--border);
  box-shadow: var(--shadow-md);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 20px;
}
.front {
  transform: rotateY(0deg);
}
.back {
  transform: rotateY(180deg);
  background: var(--accent-bg);
  color: var(--accent-text);
}
.card-front-label, .card-back-label {
  font-size: 13px;
  color: var(--muted);
  margin-bottom: 16px;
  letter-spacing: 1px;
}
.card-front-text {
  font-size: 32px;
  font-weight: 700;
  word-break: break-word;
}
.card-back-text {
  font-size: 26px;
  font-weight: 600;
}
.card-nav {
  display: flex;
  gap: 16px;
  justify-content: center;
  margin-top: 16px;
}
.card-nav button {
  background: var(--surface2);
  border: 0.5px solid var(--border);
  border-radius: 60px;
  padding: 12px 24px;
  font-weight: 600;
  cursor: pointer;
}
.filter-buttons {
  display: flex;
  gap: 8px;
  margin-bottom: 12px;
}
.filter-btn {
  flex: 1;
  background: var(--surface2);
  border-radius: 40px;
  padding: 8px;
  font-size: 13px;
  font-weight: 500;
  text-align: center;
  cursor: pointer;
}
.filter-btn.active-filter {
  background: var(--accent);
  color: white;
  border-color: var(--accent);
}

/* стили для теста */
.quiz-question-card {
  background: var(--surface);
  border-radius: 36px;
  padding: 28px 16px;
  text-align: center;
  border: 0.5px solid var(--border);
}
.quiz-word {
  font-size: 32px;
  font-weight: 700;
}
.options-grid {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.opt-btn {
  width: 100%;
  padding: 14px 18px;
  background: var(--surface2);
  border: 0.5px solid var(--border);
  border-radius: 60px;
  text-align: left;
  cursor: pointer;
}
.opt-btn.correct { background: var(--green-bg); border-color: var(--green); color: var(--green); }
.opt-btn.wrong { background: var(--red-bg); border-color: var(--red); color: var(--red); }
.start-btn, .next-btn {
  width: 100%;
  padding: 15px;
  border-radius: 60px;
  font-weight: 600;
  cursor: pointer;
}
.start-btn { background: var(--accent); color: white; border: none; }
.next-btn { background: var(--surface2); border: 0.5px solid var(--border); }
.next-btn:disabled { opacity: 0.5; cursor: not-allowed; }
</style>
</head>
<body>
<div class="header">
  <div class="header-left">
    <div class="logo">学</div>
    <div class="header-info"><h1>Учим китайский</h1><p>карточки + тест</p></div>
  </div>
  <div class="theme-toggle" id="themeToggle">🌙</div>
</div>

<div class="tabs" id="tabsContainer">
  <div class="tab active" data-tab="words-tab">📖 Слова</div>
  <div class="tab" data-tab="prices-tab">💰 Цены</div>
  <div class="tab" data-tab="quiz-tab">🧠 Тест</div>
  <div class="tab" data-tab="cards-tab">🃏 Карточки</div>
</div>

<div id="words-tab" class="screen active">
  <div class="card"><div class="card-header">🍜 Лексика</div><div id="words-list-container"></div></div>
</div>
<div id="prices-tab" class="screen">
  <div class="card"><div class="card-header">🏷️ Ценники</div><div id="prices-list-container"></div></div>
</div>
<div id="quiz-tab" class="screen">
  <div class="stats-grid"><div class="stat-card"><div class="stat-number" id="s-total">0</div><div>всего</div></div>
  <div class="stat-card"><div class="stat-number" id="s-correct">0</div><div>верно</div></div>
  <div class="stat-card"><div class="stat-number" id="s-wrong">0</div><div>ошибки</div></div>
  <div class="stat-card" id="streakCard"><div class="stat-number" id="streak-count">0</div><div>🔥 серия</div><div class="best-streak-hint" id="best-streak-hint"></div></div></div>
  <div class="card"><div class="mode-switch" style="display:flex; gap:12px; padding:12px"><button id="mode-words-btn" class="filter-btn active-filter">📖 Слова</button><button id="mode-prices-btn" class="filter-btn">💰 Цены</button></div></div>
  <div id="quiz-idle"><button class="start-btn" id="startQuizBtn">▶ Начать тест</button></div>
  <div id="quiz-active" style="display:none; flex-direction:column; gap:18px;"><div class="quiz-question-card"><div class="quiz-label" id="q-label"></div><div class="quiz-word" id="q-word"></div></div><div class="options-grid" id="q-options"></div><button class="next-btn" id="nextQuizBtn" disabled>➡ Следующий</button></div>
</div>
<div id="cards-tab" class="screen">
  <div class="filter-buttons" id="cardFilter">
    <div class="filter-btn active-filter" data-filter="both">🎲 Все</div>
    <div class="filter-btn" data-filter="words">📖 Слова</div>
    <div class="filter-btn" data-filter="prices">💰 Цены</div>
  </div>
  <div class="flip-container"><div class="flipper" id="flipper"><div class="front"><div class="card-front-label">🔤 вопрос</div><div class="card-front-text" id="frontText">—</div></div><div class="back"><div class="card-back-label">📖 перевод</div><div class="card-back-text" id="backText">—</div></div></div></div>
  <div class="card-nav"><button id="prevCardBtn">◀ Назад</button><button id="nextCardBtn">Вперёд ▶</button></div>
  <div style="text-align:center; margin-top:12px; font-size:13px; color:var(--muted);" id="cardCounter">0 / 0</div>
</div>

<script>
// -------------------------- ЗАКРЕПЛЁННЫЕ ДАННЫЕ --------------------------
const FIXED_WORDS = {
  "чайник": "хуу", "хуан (хозяин)": "лаобань", "ложка": "сшаодзы", "вилка": "чхаа",
  "пароварка": "Вэй Я Гуо", "сковородка (мал.)": "Щьюэ Пин Гуо", "сковородка (бол.)": "Тай Гуо",
  "сито": "Джэн Лонг", "3 ножа (в комплекте)": "Сан Ба Дао (И Тао)", "черпак": "Сао дзы",
  "лопатка": "Гуо Тшан", "доска разделочная": "Бан", "термос": "Бэй дз (Ка Фэй Бэй)",
  "бритва": "Ти Щю Дао", "маленькие щипчики": "Сяо Джы Дья Дао", "щипчики большие": "Да Джы Дья Дао"
};
const rawPrices = [["2680","льян тьен льёу бай ба"],["1280","и тьен ар бай ба"],["2980","льян тьен дьёу бай ба"],["980","дьёу бай ба"],["198","и бай дьёу шы ба"],["398","сан бай дьёу шы ба"],["298","льян бай дьёу шы ба"],["80","ба шы"],["100","и бай"]];
const FIXED_PRICES = Object.fromEntries(rawPrices);

// -------------------------- ТЕМА (светлая/тёмная/система) --------------------------
let currentTheme = localStorage.getItem('theme') || 'system';
function applyTheme() {
  const isDark = currentTheme === 'dark' || (currentTheme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
  document.body.classList.toggle('dark', isDark);
  document.getElementById('themeToggle').innerText = isDark ? '☀️' : '🌙';
}
function toggleTheme() {
  if (currentTheme === 'light') currentTheme = 'dark';
  else if (currentTheme === 'dark') currentTheme = 'system';
  else currentTheme = 'light';
  localStorage.setItem('theme', currentTheme);
  applyTheme();
}
document.getElementById('themeToggle').onclick = toggleTheme;
applyTheme();
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (currentTheme === 'system') applyTheme(); });

// -------------------------- ЗВУКИ (Web Audio) --------------------------
let audioCtx = null;
function playSound(type) {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    gain.gain.value = 0.15;
    if (type === 'correct') { osc.frequency.value = 880; gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.4); }
    else { osc.frequency.value = 440; gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.5); }
    osc.start();
    osc.stop(audioCtx.currentTime + 0.4);
    if (audioCtx.state === 'suspended') audioCtx.resume();
  } catch(e) { console.warn('audio error'); }
}

// -------------------------- СТАТИСТИКА ТЕСТА --------------------------
let stats = { total: 0, correct: 0, wrong: 0, streak: 0, bestStreak: 0 };
function loadStats() { try { const s = localStorage.getItem('zh_stats_v4'); if(s) Object.assign(stats, JSON.parse(s)); } catch(e){} }
function saveStats() { localStorage.setItem('zh_stats_v4', JSON.stringify(stats)); }
function updateStatsUI() {
  document.getElementById('s-total').innerText = stats.total;
  document.getElementById('s-correct').innerText = stats.correct;
  document.getElementById('s-wrong').innerText = stats.wrong;
  document.getElementById('streak-count').innerText = stats.streak;
  document.getElementById('best-streak-hint').innerText = `🏆 рекорд: ${stats.bestStreak}`;
  if (stats.streak > 0 && (stats.streak % 3 === 0 || stats.streak === stats.bestStreak)) {
    const streakCard = document.getElementById('streakCard');
    streakCard.classList.add('streak-animate');
    setTimeout(() => streakCard.classList.remove('streak-animate'), 500);
  }
}
function updateStatsAfterAnswer(isCorrect) {
  stats.total++;
  if (isCorrect) { stats.correct++; stats.streak++; if(stats.streak>stats.bestStreak) stats.bestStreak=stats.streak; playSound('correct'); }
  else { stats.wrong++; stats.streak=0; playSound('wrong'); }
  saveStats(); updateStatsUI();
}

// -------------------------- ОТРИСОВКА СПИСКОВ --------------------------
function renderFixedWords() { const c=document.getElementById('words-list-container'); if(!c)return; c.innerHTML=Object.entries(FIXED_WORDS).map(([ru,zh])=>`<div class="list-item"><div class="word-ru">${ru}</div><div class="word-zh">${zh}</div></div>`).join(''); }
function renderFixedPrices() { const c=document.getElementById('prices-list-container'); if(!c)return; c.innerHTML=Object.entries(FIXED_PRICES).sort((a,b)=>parseInt(a[0])-parseInt(b[0])).map(([num,pron])=>`<div class="list-item"><div class="price-num">${num} ¥</div><div class="price-pron">${pron}</div></div>`).join(''); }

// -------------------------- ТЕСТ (слова/цены) --------------------------
let quizMode = 'words', quizActive = false, currentQuestion = null, answerLock = false, nextBtn = document.getElementById('nextQuizBtn');
function getVocab() { return quizMode === 'words' ? FIXED_WORDS : FIXED_PRICES; }
function generateQuestion() {
  const vocab = getVocab(), keys = Object.keys(vocab);
  if (keys.length<2) return null;
  const correctKey = keys[Math.floor(Math.random()*keys.length)];
  const correctAns = vocab[correctKey];
  const others = Object.values(vocab).filter(v=>v!==correctAns);
  if(others.length===0) return null;
  const wrongOpts = others.sort(()=>Math.random()-0.5).slice(0,3);
  let opts = [correctAns, ...wrongOpts];
  for(let i=opts.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[opts[i],opts[j]]=[opts[j],opts[i]];}
  return { key: correctKey, answer: correctAns, options: opts };
}
function renderQuizUI() {
  if(!currentQuestion) return;
  document.getElementById('q-label').innerText = quizMode==='words' ? '📖 Как перевести?' : '🔢 Произношение цены';
  document.getElementById('q-word').innerText = quizMode==='words' ? currentQuestion.key : `${currentQuestion.key} ¥`;
  const container = document.getElementById('q-options');
  container.innerHTML = '';
  currentQuestion.options.forEach(opt => {
    const btn = document.createElement('button'); btn.className='opt-btn'; btn.innerText=opt;
    btn.onclick = () => handleQuizAnswer(btn, opt);
    container.appendChild(btn);
  });
  answerLock = false; nextBtn.disabled = true;
}
function handleQuizAnswer(btn, selected) {
  if(answerLock) return;
  const isCorrect = (selected === currentQuestion.answer);
  answerLock = true;
  const allBtns = document.querySelectorAll('#q-options .opt-btn');
  allBtns.forEach(b=>{ b.disabled=true; if(b.innerText===currentQuestion.answer) b.classList.add('correct'); if(b===btn && !isCorrect) b.classList.add('wrong'); else if(b===btn && isCorrect) b.classList.add('correct'); });
  updateStatsAfterAnswer(isCorrect);
  nextBtn.disabled = false;
}
function nextQuestion() { if(!quizActive || nextBtn.disabled) return; const newQ = generateQuestion(); if(!newQ) return; currentQuestion = newQ; renderQuizUI(); }
function startQuiz() { if(Object.keys(getVocab()).length<2) { alert('Нужно минимум 2 слова/цены'); return; } const q = generateQuestion(); if(!q) return; quizActive=true; currentQuestion=q; document.getElementById('quiz-idle').style.display='none'; document.getElementById('quiz-active').style.display='flex'; renderQuizUI(); }
function endQuiz() { quizActive=false; document.getElementById('quiz-active').style.display='none'; document.getElementById('quiz-idle').style.display='block'; }
function setQuizMode(mode) { quizMode = mode; document.getElementById('mode-words-btn').classList.toggle('active-filter', mode==='words'); document.getElementById('mode-prices-btn').classList.toggle('active-filter', mode==='prices'); if(quizActive) endQuiz(); }
document.getElementById('mode-words-btn').onclick = () => setQuizMode('words');
document.getElementById('mode-prices-btn').onclick = () => setQuizMode('prices');
document.getElementById('startQuizBtn').onclick = startQuiz;
nextBtn.onclick = nextQuestion;

// -------------------------- КАРТОЧКИ (объединённые слова+цены, фильтр, свайпы) --------------------------
let allCards = []; let filteredCards = []; let currentCardIndex = 0; let isFlipped = false;
function buildAllCards() {
  const wordsCards = Object.entries(FIXED_WORDS).map(([front, back]) => ({ type: 'word', front, back }));
  const priceCards = Object.entries(FIXED_PRICES).map(([num, pron]) => ({ type: 'price', front: `${num} ¥`, back: pron }));
  return [...wordsCards, ...priceCards];
}
function updateFilteredCards(filter) {
  if (filter === 'words') filteredCards = allCards.filter(c => c.type === 'word');
  else if (filter === 'prices') filteredCards = allCards.filter(c => c.type === 'price');
  else filteredCards = [...allCards];
  if (filteredCards.length === 0) { document.getElementById('frontText').innerText = '—'; document.getElementById('backText').innerText = '—'; document.getElementById('cardCounter').innerText = `0 / 0`; return; }
  if (currentCardIndex >= filteredCards.length) currentCardIndex = filteredCards.length - 1;
  if (currentCardIndex < 0 && filteredCards.length) currentCardIndex = 0;
  renderCurrentCard();
}
function renderCurrentCard() {
  if (!filteredCards.length) return;
  const card = filteredCards[currentCardIndex];
  document.getElementById('frontText').innerText = card.front;
  document.getElementById('backText').innerText = card.back;
  document.getElementById('cardCounter').innerText = `${currentCardIndex+1} / ${filteredCards.length}`;
  if (isFlipped) { document.getElementById('flipper').classList.remove('flipped'); isFlipped = false; }
}
function nextCard() { if(filteredCards.length && currentCardIndex+1 < filteredCards.length) { currentCardIndex++; renderCurrentCard(); } }
function prevCard() { if(filteredCards.length && currentCardIndex-1 >= 0) { currentCardIndex--; renderCurrentCard(); } }
function flipCard() { document.getElementById('flipper').classList.toggle('flipped'); isFlipped = !isFlipped; }
document.getElementById('nextCardBtn').onclick = nextCard;
document.getElementById('prevCardBtn').onclick = prevCard;
document.getElementById('flipper').onclick = flipCard;
document.querySelectorAll('#cardFilter .filter-btn').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('#cardFilter .filter-btn').forEach(b => b.classList.remove('active-filter'));
    btn.classList.add('active-filter');
    const filter = btn.dataset.filter;
    updateFilteredCards(filter);
  };
});

// -------------------------- СВАЙПЫ для смены вкладок --------------------------
let touchStartX = 0, touchEndX = 0;
document.body.addEventListener('touchstart', (e) => { touchStartX = e.changedTouches[0].screenX; });
document.body.addEventListener('touchend', (e) => {
  touchEndX = e.changedTouches[0].screenX;
  const diff = touchEndX - touchStartX;
  if (Math.abs(diff) < 50) return;
  const tabs = ['words-tab', 'prices-tab', 'quiz-tab', 'cards-tab'];
  let currentIdx = tabs.findIndex(id => document.getElementById(id).classList.contains('active'));
  if (diff < 0 && currentIdx < tabs.length-1) switchTab(tabs[currentIdx+1]);
  else if (diff > 0 && currentIdx > 0) switchTab(tabs[currentIdx-1]);
});

// -------------------------- ПЕРЕКЛЮЧЕНИЕ ВКЛАДОК и общая инициализация --------------------------
function switchTab(tabId) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(tabId).classList.add('active');
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelector(`.tab[data-tab="${tabId}"]`).classList.add('active');
  if (tabId === 'words-tab') renderFixedWords();
  if (tabId === 'prices-tab') renderFixedPrices();
  if (tabId === 'quiz-tab') { updateStatsUI(); if(quizActive) endQuiz(); document.getElementById('quiz-idle').style.display='block'; document.getElementById('quiz-active').style.display='none'; }
  if (tabId === 'cards-tab') { if (!allCards.length) allCards = buildAllCards(); updateFilteredCards('both'); }
}
document.querySelectorAll('.tab').forEach(tab => { tab.onclick = () => switchTab(tab.dataset.tab); });

loadStats(); updateStatsUI(); renderFixedWords(); renderFixedPrices(); allCards = buildAllCards(); updateFilteredCards('both'); setQuizMode('words');
</script>
</body>
</html>
